name: Run Small test
on: [push, pull_request] # yamllint disable-line rule:truthy
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The scripts are POSIX shell and use no GNU-only utility options, so
        # they must work on macOS as well as on Linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - name: Run tests
        run: |
          git config --global user.email "example@example.com"
          git config --global user.name "Example Example"
          # TODO: reinstate `make test` and remove the other `make` calls.
          # make test
          make -C tests/resolve-adjacent-conflicts-test && make -C tests/resolve-import-conflicts-test
